<!DOCTYPE HTML>
<html>
<head>
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="rithun, rithun vignesh">

<title>Rithun's Creative Corner</title>
<style>
    body {
        font-family: 'Comic Sans MS', cursive, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(45deg, #FFD700, #FF69B4, #4169E1);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
    }

    .header::before {
        content: "⭐";
        position: absolute;
        left: 10%;
        top: 20px;
        font-size: 40px;
        animation: float 3s ease-in-out infinite;
    }

    .header::after {
        content: "⭐";
        position: absolute;
        right: 10%;
        top: 20px;
        font-size: 40px;
        animation: float 3s ease-in-out infinite;
        animation-delay: 1.5s;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    .header h1 {
        font-size: clamp(36px, 6vw, 48px);
        color: #fff;
        margin-bottom: 10px;
        text-shadow: 3px 3px 0 #FF69B4,
                     6px 6px 0 #4169E1;
        letter-spacing: 2px;
    }

    .sections-container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        margin: 0 auto;
        max-width: 1200px;
        position: relative;
        z-index: 1;
    }

    @media (max-width: 768px) {
        .sections-container {
            flex-direction: column;
        }
    }

    .section {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 25px;
        padding: 25px;
        flex: 1;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        backdrop-filter: blur(4px);
        border: 2px solid rgba(255, 255, 255, 0.18);
        transform-style: preserve-3d;
        transition: transform 0.3s ease;
    }

    .section:hover {
        transform: translateZ(20px);
    }

    .section h2 {
        color: #FF69B4;
        font-size: clamp(24px, 5vw, 36px);
        margin-bottom: 20px;
        text-align: center;
        text-shadow: 2px 2px 0 #4169E1;
        position: relative;
        display: inline-block;
        width: 100%;
    }

    .section h2::before {
        content: "✨";
        position: absolute;
        left: 10px;
        animation: sparkle 2s infinite;
    }

    .section h2::after {
        content: "✨";
        position: absolute;
        right: 10px;
        animation: sparkle 2s infinite;
        animation-delay: 1s;
    }

    @keyframes sparkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.5); }
    }

    .content-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 10px;
    }

    .card {
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        border: 3px solid #fff;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .card:hover {
        transform: translateY(-5px) rotate(2deg);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        border-color: #FFD700;
    }

    .card img {
        width: 100%;
        max-width: 200px;
        height: auto;
        aspect-ratio: 1;
        border-radius: 20px;
        margin-bottom: 15px;
        border: 4px solid #fff;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }

    .card:hover img {
        transform: scale(1.05);
    }

    .card h3 {
        color: #fff;
        margin-bottom: 10px;
        font-size: clamp(18px, 4vw, 24px);
        text-shadow: 2px 2px 0 #4169E1;
    }

    .card p {
        color: #fff;
        font-size: clamp(14px, 3vw, 16px);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
    }
</style>

</head>
<body>
    <div class="header">
        <h1>Welcome to Rithun's Creative Corner! 🎨</h1>
    </div>

    <div class="sections-container">
        <div class="section">
            <h2>🎮 🏆 🚀 Game Zone</h2>
            <div class="content-grid">
                <div class="card" onclick="window.location.href='games/bubble_pop/index.html'">
                    <img src="games/bubble_pop/bubble-preview.png" alt="Bubble Pop Game" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect width=%22200%22 height=%22200%22 fill=%22%23FFB6C1%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%23FF69B4%22/><circle cx=%22150%22 cy=%2270%22 r=%2225%22 fill=%22%2387CEEB%22/><circle cx=%22100%22 cy=%22130%22 r=%2230%22 fill=%22%23FFD700%22/><text x=%22100%22 y=%2230%22 font-family=%22Arial%22 font-size=%2216%22 fill=%22white%22 text-anchor=%22middle%22>Pop the Bubbles!</text></svg>'">
                    <h3>Bubble Pop Adventure</h3>
                    <p>Pop colorful bubbles in this fun and engaging game!</p>
                </div>
                <div class="card" onclick="window.location.href='games/speed_racer/index.html'">
                    <img src="games/speed_racer/preview.png" alt="Speed Racer Game" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect width=%22200%22 height=%22200%22 fill=%22%23333%22/><rect x=%2220%22 y=%2250%22 width=%22160%22 height=%22100%22 fill=%22%23666%22/><rect x=%2270%22 y=%22120%22 width=%2240%22 height=%2220%22 fill=%22%23FF0000%22/><circle cx=%2280%22 cy=%22140%22 r=%228%22 fill=%22%23000%22/><circle cx=%22100%22 cy=%22140%22 r=%228%22 fill=%22%23000%22/><text x=%22100%22 y=%2230%22 font-family=%22Arial%22 font-size=%2216%22 fill=%22white%22 text-anchor=%22middle%22>Race to Win!</text></svg>'">
                    <h3>Speed Racer</h3>
                    <p>Race through traffic and become the ultimate speed racer! How long can you survive?</p>
                </div>
                <!-- More games will be added here -->
            </div>
        </div>

        <div class="section">
            <h2>📚 ✨ 🌟 Story World</h2>
            <div class="content-grid">
                <!-- Stories will be added here -->
                <div class="card">
                    <h3>Coming Soon!</h3>
                    <p>Stay tuned for exciting stories!</p>
                </div>
            </div>
        </div>
    </div>


</body>
