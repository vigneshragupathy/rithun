<!DOCTYPE HTML>
<html>
<head>
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="rithun, rithun vignesh">
<meta name="description" content="rithun website and blog">
<title>Rithun's Creative Corner</title>
<style>
    body {
        font-family: 'Comic Sans MS', cursive, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(45deg, #FFD700, #FF69B4, #4169E1);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
    }

    .header::before {
        content: "⭐";
        position: absolute;
        left: 10%;
        top: 20px;
        font-size: 40px;
        animation: float 3s ease-in-out infinite;
    }

    .header::after {
        content: "⭐";
        position: absolute;
        right: 10%;
        top: 20px;
        font-size: 40px;
        animation: float 3s ease-in-out infinite;
        animation-delay: 1.5s;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    .header h1 {
        font-size: clamp(36px, 6vw, 48px);
        color: #fff;
        margin-bottom: 10px;
        text-shadow: 3px 3px 0 #FF69B4,
                     6px 6px 0 #4169E1;
        letter-spacing: 2px;
    }

    .age-counter {
        text-align: center;
        font-size: 24px;
        color: #fff;
        margin-bottom: 40px;
        text-shadow: 2px 2px 0 #4169E1;
        background: rgba(255, 255, 255, 0.2);
        padding: 15px;
        border-radius: 20px;
        backdrop-filter: blur(5px);
        display: inline-block;
    }

    .sections-container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        margin: 0 auto;
        max-width: 1200px;
        position: relative;
        z-index: 1;
    }

    @media (max-width: 768px) {
        .sections-container {
            flex-direction: column;
        }
    }

    .section {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 25px;
        padding: 25px;
        flex: 1;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        backdrop-filter: blur(4px);
        border: 2px solid rgba(255, 255, 255, 0.18);
        transform-style: preserve-3d;
        transition: transform 0.3s ease;
    }

    .section:hover {
        transform: translateZ(20px);
    }

    .section h2 {
        color: #FF69B4;
        font-size: clamp(24px, 5vw, 36px);
        margin-bottom: 20px;
        text-align: center;
        text-shadow: 2px 2px 0 #4169E1;
        position: relative;
        display: inline-block;
        width: 100%;
    }

    .section h2::before {
        content: "✨";
        position: absolute;
        left: 10px;
        animation: sparkle 2s infinite;
    }

    .section h2::after {
        content: "✨";
        position: absolute;
        right: 10px;
        animation: sparkle 2s infinite;
        animation-delay: 1s;
    }

    @keyframes sparkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.5); }
    }

    .content-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 10px;
    }

    .card {
        background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        border: 3px solid #fff;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .card:hover {
        transform: translateY(-5px) rotate(2deg);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        border-color: #FFD700;
    }

    .card img {
        width: 100%;
        max-width: 200px;
        height: auto;
        aspect-ratio: 1;
        border-radius: 20px;
        margin-bottom: 15px;
        border: 4px solid #fff;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }

    .card:hover img {
        transform: scale(1.05);
    }

    .card h3 {
        color: #fff;
        margin-bottom: 10px;
        font-size: clamp(18px, 4vw, 24px);
        text-shadow: 2px 2px 0 #4169E1;
    }

    .card p {
        color: #fff;
        font-size: clamp(14px, 3vw, 16px);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
    }

    .profile-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        margin: 20px auto;
        display: block;
        border: 5px solid white;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
</style>

<body>
    <div class="header">
        <h1>Welcome to Rithun's Creative Corner! 🎨</h1>
        <img src="rithun_birthday.jpg" class="profile-image" alt="Rithun's Photo">
        <div class="age-counter" id="demo"></div>

    <div class="sections-container">
        <div class="section">
            <h2>🎮 My Games</h2>

                <div class="card" onclick="window.location.href='games/bubble_pop/index.html'">

                    <h3>Bubble Pop Adventure</h3>
                    <p>Pop colorful bubbles in this fun and engaging game!</p>
                </div>
                <div class="card" onclick="window.location.href='games/speed_racer/index.html'">
                    <img src="games/speed_racer/preview.png" alt="Speed Racer Game" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f0f0f0%22/><text x=%22100%22 y=%22100%22 font-family=%22Arial%22 font-size=%2220%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>Speed Racer</text></svg>'">
                    <h3>Speed Racer</h3>
                    <p>Race through traffic and become the ultimate speed racer! How long can you survive?</p>
                </div>
                <!-- More games will be added here -->
            </div>
        </div>

        <div class="section">
            <h2>📚 My Stories</h2>
            <div class="content-grid">
                <!-- Stories will be added here -->
                <div class="card">
                    <h3>Coming Soon!</h3>
                    <p>Stay tuned for exciting stories!</p>
                </div>
            </div>
        </div>
    </div>

<script>
// Set the date we're counting down to
var countDownDate = new Date("Dec 14, 2017 04:14:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

    // Get todays date and time
    var now = new Date().getTime();
    
    // Find the distance between now and the count down date
    var distance1 = now - countDownDate;
    var distance = countDownDate + now;
    
    // Time calculations for days, hours, minutes and seconds
    //var days = Math.floor(distance / (1000 * 60 * 60 * 24));
	var years = Math.floor(distance1 / (1000 * 60 * 60 * 24)/365);
    var days1 = Math.floor((distance1 / (1000 * 60 * 60 * 24)) % 365);
    var hours = Math.floor((distance1 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance1 % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance1 % (1000 * 60)) / 1000);
    
    // Output the result in an element with id="demo"
    document.getElementById("demo").innerHTML = "I am " + years + " years, " + days1 + " days, "
        + hours + " hours, " + minutes + " minutes, and " + seconds + " seconds old!";
    
    // If the count down is over, write some text 
    if (distance < 0) {
        clearInterval(x);
        document.getElementById("demo").innerHTML = "Error calculating age!";
    }
}, 1000);
</script>

</html>
